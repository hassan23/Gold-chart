name: Update gold data

on:
  schedule:
    - cron: "3,18,33,48 * * * 0-5"  # every 15 minutes, Sunday to Friday (gold is closed Saturday)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new candles
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python -u scripts/update_twelvedata.py
      - name: Commit if the data changed
        run: |
          git config user.name "gold-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/XAUUSD_1m.csv
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: update to $(tail -1 data/XAUUSD_1m.csv | cut -d, -f1) NY" && git push; fi
