name: Download latest gold data now

on:
  workflow_dispatch:
    inputs:
      refetch_days:
        description: "Also re-download the last N days (0 = only new data). Use 1-3 to replace provisional candles with Dukascopy's final ones."
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new candles
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: |
          if [ -n "$TWELVEDATA_KEY" ]; then
            echo "Using Twelve Data (secret TWELVEDATA_KEY is set)"
            python -u scripts/update_twelvedata.py
          else
            echo "No TWELVEDATA_KEY secret: trying Dukascopy (often blocked from GitHub runners)"
            python -u scripts/update_data.py
          fi
      - name: Commit and push if the data changed
        run: |
          git config user.name "gold-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/XAUUSD_1m.csv
          if git diff --cached --quiet; then
            echo "No new candles: data was already up to date."
          else
            git commit -m "data (manual): update to $(tail -1 data/XAUUSD_1m.csv | cut -d, -f1) NY"
            git push
            echo "Committed. Last candle: $(tail -1 data/XAUUSD_1m.csv | cut -d, -f1) NY"
          fi
